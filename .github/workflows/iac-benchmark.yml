name: IaC Scanner Benchmark Pipeline

on:
  workflow_dispatch:

jobs:
  benchmark-scanners:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # Pinned to v4

      - name: Create Results Directory
        run: mkdir -p benchmark_results

      # --- BASELINE METRICS ---
      - name: Calculate Total Terraform Entities
        run: |
          echo "Calculating absolute entity count in repository..."
          TOTAL_ENTITIES=$(grep -rE "^resource |^data |^module " . --include="*.tf" | wc -l)
          echo "TOTAL_BASELINE_ENTITIES=$TOTAL_ENTITIES" >> $GITHUB_ENV
          echo "Found $TOTAL_ENTITIES baseline entities in the codebase."

      # --- SCANNER 1: CHECKOV ---
      - name: Run Checkov Scanner
        run: |
          echo "Fetching Checkov version..."
          CHECKOV_VER=$(docker run --rm bridgecrew/checkov@sha256:12a62da01af22654883aee3b9da18ba4297f123f5122663bf65235db37934144 --version | head -n 1 | tr -d '\r\n')
          echo "CHECKOV_VERSION=$CHECKOV_VER" >> $GITHUB_ENV
          
          echo "Starting Checkov..."
          start_time=$(date +%s%N)
          
          docker run --rm \
            --volume $(pwd):/src:ro \
            bridgecrew/checkov@sha256:12a62da01af22654883aee3b9da18ba4297f123f5122663bf65235db37934144 \
            -d /src/cloudgoat/scenarios/aws \
            -o json \
            > benchmark_results/checkov-results.json || true
            
          end_time=$(date +%s%N)
          CHECKOV_RUNTIME=$(( ($end_time - $start_time) / 1000000 ))
          echo "CHECKOV_RUNTIME_MS=$CHECKOV_RUNTIME" >> $GITHUB_ENV
          echo "Checkov completed in $CHECKOV_RUNTIME ms"

      # --- SCANNER 2: TRIVY ---
      - name: Run Trivy Scanner
        run: |
          echo "Fetching Trivy version..."
          TRIVY_VER=$(docker run --rm aquasec/trivy@sha256:7cced7cae583819fc7806d4cbc0dbbc7cad18b99f7d3e235192e6da8c091045c --version | head -n 1 | awk '{print $2}' | tr -d '\r\n')
          echo "TRIVY_VERSION=$TRIVY_VER" >> $GITHUB_ENV
        
          echo "Starting Trivy..."
          start_time=$(date +%s%N)
          
          docker run --rm \
            --volume $(pwd):/src:ro \
            --volume $(pwd)/benchmark_results:/results \
            aquasec/trivy@sha256:7cced7cae583819fc7806d4cbc0dbbc7cad18b99f7d3e235192e6da8c091045c \
            config /src/cloudgoat/scenarios/aws \
            --format json \
            --output /results/trivy-results.json || true
            
          end_time=$(date +%s%N)
          TRIVY_RUNTIME=$(( ($end_time - $start_time) / 1000000 ))
          echo "TRIVY_RUNTIME_MS=$TRIVY_RUNTIME" >> $GITHUB_ENV
          echo "Trivy completed in $TRIVY_RUNTIME ms"

      # --- SCANNER 3: KICS ---
      - name: Run KICS Scanner
        run: |
          echo "Fetching KICS version..."
          KICS_VER=$(docker run --rm --entrypoint kics checkmarx/kics@sha256:3e5a268eb8adda2e5a483c9359ddfc4cd520ab856a7076dc0b1d8784a37e2602 version | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -n 1 | tr -d '\r\n')
          echo "KICS_VERSION=$KICS_VER" >> $GITHUB_ENV
        
          echo "Starting KICS..."
          start_time=$(date +%s%N)
          
          docker run --rm \
            --volume $(pwd):/src:ro \
            --volume $(pwd)/benchmark_results:/results \
            checkmarx/kics@sha256:3e5a268eb8adda2e5a483c9359ddfc4cd520ab856a7076dc0b1d8784a37e2602 \
            scan -p /src/cloudgoat/scenarios/aws \
            --type Terraform \
            --report-formats json \
            -o /results/ \
            --output-name kics-results || true
            
          end_time=$(date +%s%N)
          KICS_RUNTIME=$(( ($end_time - $start_time) / 1000000 ))
          echo "KICS_RUNTIME_MS=$KICS_RUNTIME" >> $GITHUB_ENV
          echo "KICS completed in $KICS_RUNTIME ms"

      # --- ARTIFACT EXPORT ---
      - name: Upload JSON Benchmark Artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # Pinned to v4
        with:
          name: iac-scanner-results
          path: benchmark_results/

      # --- GENERATE SUMMARY ---
      - name: Generate Job Summary
        if: always()
        run: |
          echo "### Pipeline Execution Metrics" >> $GITHUB_STEP_SUMMARY
          echo "| Scanner | Version | Result |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| **Baseline Entities** | - | $TOTAL_BASELINE_ENTITIES (count) |" >> $GITHUB_STEP_SUMMARY
          echo "| **Checkov** | ${{ env.CHECKOV_VERSION }} | ${{ env.CHECKOV_RUNTIME_MS }} ms |" >> $GITHUB_STEP_SUMMARY
          echo "| **Trivy** | ${{ env.TRIVY_VERSION }} | ${{ env.TRIVY_RUNTIME_MS }} ms |" >> $GITHUB_STEP_SUMMARY
          echo "| **KICS** | ${{ env.KICS_VERSION }} | ${{ env.KICS_RUNTIME_MS }} ms |" >> $GITHUB_STEP_SUMMARY
